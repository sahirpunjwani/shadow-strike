<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Assassin: Hunt & Run</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui-overlay">
            <div class="stat-box">Gems: <span id="gem-count">0</span></div>
            <div class="stat-box">Eliminations: <span id="kill-count">0</span></div>
        </div>

        <div id="start-screen" class="modal active">
            <div class="logo">NEON ASSASSIN</div>
            <p>Click anywhere to move & attack from behind.<br>Avoid getting shot when spotted!</p>
            <button id="start-btn">Start Infiltration</button>
        </div>

        <div id="game-over-screen" class="modal">
            <div class="logo fatal">ELIMINATED</div>
            <p>The guard forces overwhelmed you.</p>
            <button id="restart-btn">Restart Hunt</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
